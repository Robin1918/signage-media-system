name: Build Signage APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-signage-player:
    name: Build SignagePlayer APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build SignagePlayer APK
        working-directory: SignagePlayer
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload SignagePlayer APK
        uses: actions/upload-artifact@v4
        with:
          name: SignagePlayer-APK
          path: SignagePlayer/app/build/outputs/apk/debug/app-debug.apk

  build-phone-uploader:
    name: Build PhoneUploader APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build PhoneUploader APK
        working-directory: PhoneUploader
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload PhoneUploader APK
        uses: actions/upload-artifact@v4
        with:
          name: PhoneUploader-APK
          path: PhoneUploader/app/build/outputs/apk/debug/app-debug.apk
